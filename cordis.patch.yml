# dsh-session-buddy bundle patch: inserts its plugin row into the web plugin
# roster. The single row mounts BOTH halves: the host side (settings
# namespace) and the browser side (ladder outline panel + notification logic
# served from this package's lib/client.js).
# Install into a dsh profile, e.g. `dsh plugin --profile web add link:<this-dir>`
# or `dsh plugin --profile web add dsh-session-buddy`.
- insert:
    - id: session-buddy
      name: 'dsh-session-buddy'
